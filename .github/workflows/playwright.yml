name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: E2E, responsive, API & accessibility tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check the test code
        run: npm run test:typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # GitHub's Ubuntu runners usually ship with Edge; install it only if it is missing.
      - name: Make sure Microsoft Edge is installed
        run: |
          if [ ! -x /opt/microsoft/msedge/msedge ]; then
            npx playwright install --with-deps msedge
          fi

      # Builds the app, starts it on localhost and runs every project:
      # api, chromium, edge, firefox, webkit and 6 phones (small, medium, large iOS and Android).
      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
